{{define "shell_head"}}
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · PromptOpt</title>

{{end}}

    {{icon "i-brand" 18}}

  </a>
  <div class="nav-group">工作区</div>

    <a class="btn-gear{{if eq .Active "settings"}} active{{end}}" href="/settings">
      {{icon "i-gear" 16}}
      设置
