<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>候选 diff {{.ID}} · PromptOpt</title>
<link rel="icon" href="data:,">
<style>
 :root{--fg:#1f2328;--dim:#6e7781;--line:#d8dee4;--bg:#f6f8fa;--card:#fff;--ok:#1a7f37;--bad:#cf222e;--warn:#9a6700}
 *{box-sizing:border-box}
 body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;margin:0;padding:2rem 1.25rem;background:var(--bg);color:var(--fg);line-height:1.5}
 main{max-width:72rem;margin:0 auto}
 h1{font-size:1.25rem;margin:0 0 .25rem}
 h2{font-size:1rem;margin:2rem 0 .75rem}
 .sub{color:var(--dim);font-size:.85rem;margin:0 0 1rem}
 a{color:#0969da;text-decoration:none}
 a:hover{text-decoration:underline}
 form.inline{display:flex;gap:.5rem;align-items:center;margin:.75rem 0;flex-wrap:wrap}
 select{font:inherit;font-size:.82rem;border:1px solid var(--line);border-radius:.35rem;padding:.25rem .35rem;background:var(--card);color:var(--fg)}
 button{font:inherit;font-size:.82rem;padding:.25rem .9rem;border:1px solid var(--line);border-radius:.4rem;background:var(--card);cursor:pointer}
 button:hover{background:var(--bg)}
 table{border-collapse:collapse;width:100%;background:var(--card);border:1px solid var(--line);border-radius:.5rem;font-size:.8rem;overflow:hidden;table-layout:fixed}
 th,td{padding:.3rem .6rem;border-top:1px solid var(--line);text-align:left;vertical-align:top}
 thead th{border-top:none;color:var(--dim);font-weight:500;white-space:nowrap;width:50%}
 td{font-family:ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
 tr.add td{background:#dafbe1}
 tr.del td{background:#ffebe9}
 tr.add td:first-child::before{content:"+ ";color:var(--ok);font-weight:700}
 tr.del td:first-child::before{content:"- ";color:var(--bad);font-weight:700}
 .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem}
 .ok{color:var(--ok)}.bad{color:var(--bad)}.dim{color:var(--dim)}
 .stats{font-size:.85rem;margin:.5rem 0}
</style>
</head>
<body>
<main>
<h1>候选 diff <span class="mono">{{.ID}}</span></h1>
<p class="sub"><a href="/">run 列表</a> · <a href="/runs/{{.ID}}/frontier">前沿看板</a> · <a href="/runs/{{.ID}}">run 详情</a></p>

<form class="inline" method="get" action="/runs/{{.ID}}/diff">
  <label for="sel-a">A</label>
  <select id="sel-a" name="a">
    {{range .Members}}<option value="{{.}}"{{if eq . $.A}} selected{{end}}>{{.}}</option>{{end}}
  </select>
  <label for="sel-b">B</label>
  <select id="sel-b" name="b">
    {{range .Members}}<option value="{{.}}"{{if eq . $.B}} selected{{end}}>{{.}}</option>{{end}}
  </select>
  <button type="submit">对比</button>
</form>

<p class="stats mono">
  A = <strong>{{.A}}</strong>（{{.ASummary}}） · B = <strong>{{.B}}</strong>（{{.BSummary}}） ·
  <span class="ok">+{{.Added}} 新增</span> / <span class="bad">-{{.Deleted}} 删除</span> / <span class="dim">{{.Same}} 相同</span>
</p>

<h2>提示词并排对比</h2>
<table>
  <thead><tr><th>A · {{.A}}</th><th>B · {{.B}}</th></tr></thead>
  <tbody>
  {{range .Lines}}
    {{if eq .Kind "same"}}
      <tr><td>{{.A}}</td><td>{{.B}}</td></tr>
    {{else if eq .Kind "add"}}
      <tr class="add"><td class="dim"></td><td>{{.B}}</td></tr>
    {{else}}
      <tr class="del"><td>{{.A}}</td><td class="dim"></td></tr>
    {{end}}
  {{end}}
  </tbody>
</table>
</main>
</body>
</html>
