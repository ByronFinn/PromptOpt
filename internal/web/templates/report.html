{{template "shell_head" .}}
</head>
<body>
<div class="shell">
{{template "shell_sidebar" .}}
<main class="main">
  <div class="page-head">
    <div>
      <div class="crumbs"><a href="/runs">Runs</a> / <a class="num" href="/runs/{{.ID}}/dashboard">{{.ID}}</a> / 优化报告</div>
      <h1>优化报告 <span class="num" style="font-size:15px;color:var(--muted)">{{.ID}}</span></h1>
      <p>优化过程与交付结论的可导出工件</p>
    </div>
  </div>

  <div class="filters">
    <a class="btn" href="/runs/{{.ID}}/dashboard">四视图看板</a>
    <a class="btn" href="/runs/{{.ID}}/frontier">前沿看板</a>
    <a class="btn" href="/runs/{{.ID}}/report.md" download>下载 report.md</a>
    <a class="btn" href="/runs/{{.ID}}/report.html" download>下载自包含 HTML</a>
  </div>

  <div class="card">
    {{.Body}}
  </div>
</main>
</div>
</body>
</html>
