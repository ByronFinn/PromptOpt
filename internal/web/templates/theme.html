{{define "page_css"}}
<style>
/* ============ 设计令牌（Data-Dense Dashboard / density 9，全站唯一 CSS 真源） ============ */
:root{
  --bg:#F8FAFC; --card:#FFFFFF; --fg:#1E3A8A; --fg-strong:#0F2547;
  --muted:#475569; --muted-bg:#E9EEF6; --border:#DBEAFE; --border-strong:#B9CBE8;
  --primary:#1E40AF; --primary-hover:#1B369C; --primary-disabled:#9DB2D9; --secondary:#3B82F6;
  --accent:#D97706; --accent-ink:#B45309; --danger:#DC2626; --ok:#15803D; --warn-bg:#FFF7E8;
  --ok-ink:#15803D; --ok-bg:#EAF7EE; --ok-line:#9BD3AC;
  --bad-ink:#DC2626; --bad-bg:#FDECEC; --bad-line:#F1A9A9;
  --warn-ink:#B45309; --warn-line:#F0C36D;
  --dim-ink:#475569; --dim-bg:#EEF2F7; --dim-line:#C9D4E2;
  --chrome-bg:#0F2547; --chrome-ink:#FFFFFF; --chrome-muted:#B9CBE8;
  --brand-arc:#F59E0B; --brand-dot:#3B82F6; --tab-active:#F59E0B;
  --proto-bg:#92400E; --proto-ink:#FEF3C7; --proto-line:#B45309;
  --dot-run:#34D399; --th-bg:#F4F8FD; --row-hover:#F6FAFF; --surface-2:#FBFCFE;
  --btn-hover:#F1F6FE; --pick-active-bg:#F0F5FF; --gridline:#E3ECF7; --pre-ink:#24344D;
  --diff-add-bg:#E4F6E9; --diff-del-bg:#FDE4E4;
  --verdict-pass-ink:#33534A; --verdict-regress-ink:#7A1F1F;
  --side-ink:#DDE7F7; --side-group:#7C93B8;
  --side-hover:rgba(59,130,246,.15); --side-line:rgba(185,203,232,.25); --side-line-strong:rgba(185,203,232,.35);
  --codeblock-bg:#0F2547; --codeblock-ink:#E6EDF3; --evt-ink:var(--fg); --heat-rgb:26,127,55;
  --radius:10px; --radius-sm:6px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px;
  --space-5:20px; --space-6:24px; --space-7:32px;
  --fs-tiny:10.5px; --fs-xs:11px; --fs-sm:11.5px; --fs-label:12px; --fs-md:12.5px;
  --fs-body:13px; --fs-body-lg:13.5px; --fs-strong:15.5px; --fs-h1:19px; --fs-stat:26px;
  --mono:ui-monospace,"SF Mono","Fira Code",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 var(--sans);
  font-variant-numeric:tabular-nums}
.num{font-family:var(--mono)}
a{color:var(--primary)}
:focus-visible{outline:2px solid var(--secondary);outline-offset:2px;border-radius:4px}
button{font:inherit;cursor:pointer}
/* reduced-motion 全局停帧同时熄灭 .dot.run 脉冲（animation:none 覆盖，无需额外规则） */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}

/* ============ 顶栏 ============ */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:var(--space-4);
  background:var(--chrome-bg);color:var(--chrome-ink);padding:0 var(--space-6);height:52px;
  box-shadow:0 1px 0 rgba(255,255,255,.08)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.02em}
.brand svg{flex:none}
.brand small{font-weight:400;color:var(--chrome-muted)}
.run-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:3px 12px;
  font-size:var(--fs-md);color:#DBEAFE}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dot-run);display:inline-block}
.dot.run{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.tabs{display:flex;gap:2px;margin-left:auto}
.tab{background:none;border:0;color:var(--chrome-muted);padding:6px 14px;border-radius:8px 8px 0 0;
  border-bottom:2px solid transparent;font-size:var(--fs-body-lg)}
.tab:hover{color:#fff;background:rgba(255,255,255,.08)}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:var(--tab-active);font-weight:600}
.proto-badge{margin-left:var(--space-4);background:var(--proto-bg);color:var(--proto-ink);font-size:var(--fs-sm);
  border:1px solid var(--proto-line);border-radius:999px;padding:2px 10px;white-space:nowrap}

/* ============ 布局 ============ */
main{max-width:1240px;margin:0 auto;padding:var(--space-6) var(--space-6) var(--space-7)}
.view{display:none}
.view.active{display:block;animation:fadein .18s ease-out}
@keyframes fadein{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}
.view-head{display:flex;align-items:baseline;gap:var(--space-4);flex-wrap:wrap;margin:var(--space-2) 0 var(--space-5)}
.view-head h1{font-size:var(--fs-h1);margin:0;color:var(--fg-strong)}
.view-head p{margin:0;color:var(--muted);font-size:var(--fs-body)}
.grid{display:grid;gap:var(--space-4)}
.cols-4{grid-template-columns:repeat(4,1fr)}
.cols-2{grid-template-columns:1.35fr 1fr}
.cols-trace{grid-template-columns:230px 1fr 1fr}
@media (max-width:1000px){.cols-4{grid-template-columns:repeat(2,1fr)}.cols-2,.cols-trace{grid-template-columns:1fr}}

/* ============ 卡片与徽标 ============ */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:var(--space-4) var(--space-5)}
.card h2{font-size:var(--fs-body);margin:0 0 var(--space-3);color:var(--muted);
  font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 .spacer{margin-left:auto}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .label{font-size:var(--fs-label);color:var(--muted)}
.stat .value{font-size:var(--fs-stat);font-weight:700;color:var(--fg-strong);font-family:var(--mono)}
.stat .sub{font-size:var(--fs-label);color:var(--muted)}
.delta-up{color:var(--ok);font-weight:600}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-xs);border-radius:999px;
  padding:1px 8px;border:1px solid var(--border-strong);background:var(--muted-bg);
  color:var(--muted);font-weight:500;vertical-align:middle}
.badge-v7{background:var(--warn-bg);border-color:var(--warn-line);color:var(--accent-ink)}
.badge-ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.badge-gray{background:var(--dim-bg);border-color:var(--dim-line);color:var(--muted)}
.badge-danger{background:var(--bad-bg);border-color:var(--bad-line);color:var(--danger)}

/* ============ 表格 / 热力表 ============ */
table{border-collapse:collapse;width:100%;font-size:var(--fs-body)}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--border)}
th{font-size:var(--fs-label);color:var(--muted);font-weight:600;background:var(--th-bg);white-space:nowrap}
td.num,th.num{text-align:right;font-family:var(--mono)}
tbody tr:hover{background:var(--row-hover)}
.heat td{font-family:var(--mono);text-align:center}
.heat th{text-align:center}
.heat .rowhead{text-align:left;font-family:var(--sans)}
/* 热力双源机制：CSS 持色（基色 --heat-rgb）、Go 持明度（--ca 由 heatAlpha 出 %.2f 数值） */
.heat .cell{position:relative;background:rgba(var(--heat-rgb),var(--ca,0))}
.heat .sd{display:block;font-size:var(--fs-tiny);color:var(--muted);line-height:1.2}
.heat .win{outline:2px solid var(--ok);outline-offset:-2px;border-radius:4px}
.heat .near-noise{text-decoration:underline dotted var(--accent);text-underline-offset:3px}
.heat tfoot td{background:var(--th-bg);font-weight:600;border-top:2px solid var(--border-strong)}
.legend{display:flex;gap:var(--space-5);flex-wrap:wrap;font-size:var(--fs-label);color:var(--muted);
  margin-top:var(--space-3)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.swatch{width:22px;height:12px;border-radius:3px;border:1px solid var(--border-strong);display:inline-block}

/* ============ 进度条 / 仪表 ============ */
.meter{margin:6px 0 2px}
.meter .bar{height:8px;background:var(--muted-bg);border-radius:4px;overflow:hidden}
.meter .fill{height:100%;background:var(--secondary);border-radius:4px}
.meter .fill.warn{background:var(--accent)}
.meter .cap{display:flex;justify-content:space-between;font-size:var(--fs-sm);color:var(--muted);margin-top:2px}

/* ============ 事件流 ============ */
.feed{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto;
  padding-right:4px;min-height:220px}
.evt{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;
  border:1px solid var(--border);border-left:3px solid var(--secondary);
  border-radius:var(--radius-sm);padding:7px 10px;background:var(--card);font-size:var(--fs-md)}
.evt t{color:var(--muted);font-size:var(--fs-xs);font-family:var(--mono)}
.evt .body{color:var(--fg)}
.evt.new{animation:slidein .25s ease-out}
@keyframes slidein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.feed-tools{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.btn{border:1px solid var(--border-strong);background:var(--card);color:var(--fg);
  border-radius:var(--radius-sm);padding:5px 12px;font-size:var(--fs-md);display:inline-flex;
  align-items:center;gap:6px;transition:background .15s,border-color .15s}
.btn:hover{background:var(--btn-hover);border-color:var(--secondary)}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.btn-primary:hover{background:var(--primary-hover)}
.btn-primary[disabled]{background:var(--primary-disabled);border-color:var(--primary-disabled);cursor:not-allowed}
.btn-ghost{border-color:transparent;background:none;color:var(--primary)}
.empty{border:1px dashed var(--border-strong);border-radius:var(--radius-sm);
  color:var(--muted);padding:var(--space-3);font-size:var(--fs-md);background:var(--surface-2)}

/* ============ 图表 ============ */
.chart-wrap{overflow-x:auto}
svg text{font-family:var(--sans)}
svg .axis{font-size:var(--fs-xs);fill:var(--muted)}
svg .gridline{stroke:var(--gridline);stroke-width:1}
svg .series-label{font-size:var(--fs-label);font-weight:600}

/* ============ trace / diff ============ */
.side-list{display:flex;flex-direction:column;gap:6px}
.pick{border:1px solid var(--border);background:var(--card);border-radius:var(--radius-sm);
  padding:8px 10px;text-align:left;display:flex;justify-content:space-between;gap:8px;
  align-items:center;transition:border-color .15s}
.pick:hover{border-color:var(--secondary)}
.pick[aria-pressed="true"]{border-color:var(--primary);background:var(--pick-active-bg);font-weight:600}
.pick .sc{font-family:var(--mono);font-size:var(--fs-label);color:var(--muted)}
pre{margin:0;white-space:pre-wrap;word-break:break-word;font:var(--fs-md)/1.6 var(--mono);
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:var(--space-3);color:var(--pre-ink)}
pre .ins{background:var(--diff-add-bg);text-decoration:none;border-radius:3px}
pre .del{background:var(--diff-del-bg);border-radius:3px}
pre .reasoning{color:var(--muted)}
details>summary{cursor:pointer;font-size:var(--fs-md);color:var(--muted);margin:8px 0}
.rep-strip{display:flex;gap:6px;align-items:flex-end;height:44px;padding:4px 0}
.rep-strip .rep{width:34px;background:var(--secondary);border-radius:3px 3px 0 0;position:relative}
.rep-strip .rep span{position:absolute;top:-16px;left:0;right:0;text-align:center;
  font-size:var(--fs-tiny);font-family:var(--mono);color:var(--muted)}
.score-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3)}
.score-item{border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px}
.score-item .k{font-size:var(--fs-sm);color:var(--muted)}
.score-item .v{font-size:17px;font-weight:700;font-family:var(--mono);color:var(--fg-strong)}

/* ============ 结论横幅 ============ */
.verdict{display:flex;gap:var(--space-4);align-items:center;border-radius:var(--radius);
  padding:var(--space-4) var(--space-5);border:1px solid var(--ok-line);background:var(--ok-bg);margin-bottom:var(--space-4)}
.verdict.inconclusive{border-color:var(--dim-line);background:var(--dim-bg)}
.verdict.regress{border-color:var(--bad-line);background:var(--bad-bg)}
.verdict .icon{flex:none}
.verdict h3{margin:0 0 2px;font-size:var(--fs-strong)}
.verdict p{margin:0;font-size:var(--fs-md);color:var(--verdict-pass-ink)}
.verdict.inconclusive p{color:var(--muted)}
.verdict.regress p{color:var(--verdict-regress-ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:var(--fs-md)}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--mono)}
.exit-codes td:first-child{font-family:var(--mono);font-weight:700}
.note{font-size:var(--fs-label);color:var(--muted);margin-top:10px;line-height:1.6}
hr.sep{border:0;border-top:1px solid var(--border);margin:var(--space-4) 0}
footer{max-width:1240px;margin:0 auto;padding:var(--space-5) var(--space-6);
  color:var(--muted);font-size:var(--fs-label);border-top:1px solid var(--border)}

/* ============ 应用外壳（侧栏 + 主区，dashboard 同源令牌） ============ */
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.sidebar{background:var(--chrome-bg);color:var(--side-ink);padding:20px 16px;position:sticky;top:0;
  height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.nav-group{margin:14px 0 4px;font-size:var(--fs-xs);letter-spacing:.12em;color:var(--side-group);text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);
  color:var(--side-ink);font-size:var(--fs-body-lg);margin:2px 0;transition:background .15s}
.nav-item:hover{background:var(--side-hover);color:#fff}
.nav-item.active{background:var(--secondary);color:#fff;font-weight:600}
.nav-item .count{margin-left:auto;font-size:var(--fs-label);opacity:.75}
.sidebar-spacer{flex:1}
.sidebar-footer{margin-top:16px;padding-top:12px;border-top:1px solid var(--side-line)}
.btn-gear{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:var(--radius-sm);
  background:transparent;border:1px solid var(--side-line-strong);color:var(--side-ink);font-size:var(--fs-body-lg);cursor:pointer}
.btn-gear:hover{background:var(--side-hover);border-color:var(--secondary)}
.btn-gear.active{background:var(--secondary);border-color:var(--secondary);color:#fff}
.main{padding:var(--space-6) var(--space-6) var(--space-7);min-width:0;max-width:1240px;margin:0 auto;width:100%}
.crumbs{font-size:var(--fs-label);color:var(--muted);margin-bottom:6px}
.page-head{display:flex;align-items:flex-end;gap:var(--space-4);margin:var(--space-2) 0 var(--space-5);flex-wrap:wrap}
.page-head h1{font-size:var(--fs-h1);margin:0;color:var(--fg-strong)}
.page-head p{margin:0;color:var(--muted);font-size:var(--fs-body)}
.badge.ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
.badge.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--accent-ink)}
.badge.bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--danger)}
.badge.dim{background:var(--dim-bg);border-color:var(--dim-line);color:var(--muted)}
.table-card{padding:0;overflow:hidden}
.table-card h3{padding:var(--space-3) var(--space-4);margin:0}
.table-card table{width:100%}
.filters{display:flex;gap:8px;align-items:center;margin-bottom:var(--space-4);flex-wrap:wrap}
.filters input,.filters select{padding:6px 10px;border:1px solid var(--border-strong);
  border-radius:var(--radius-sm);background:var(--card);color:var(--fg);font-size:var(--fs-body)}
@media (max-width:900px){.shell{grid-template-columns:1fr}.sidebar{position:relative;height:auto}.cols-4{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.cols-4{grid-template-columns:1fr}}

/* ============ 图标与新组件（设计规范 §2/§3.2） ============ */
.sprite{display:none}
.ic{display:inline-block;vertical-align:-2px;flex:none}
.mono{font-family:var(--mono)}
.dim{color:var(--muted)}
.primary{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--primary);
  background:var(--primary);color:#fff;font-weight:600;border-radius:var(--radius-sm);
  padding:5px 12px;font-size:var(--fs-md);transition:background .15s,border-color .15s}
.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.primary[disabled]{background:var(--primary-disabled);border-color:var(--primary-disabled);cursor:not-allowed}
.warn-strip{display:flex;gap:var(--space-2);align-items:center;border:1px solid var(--warn-line);
  background:var(--warn-bg);color:var(--warn-ink);border-radius:var(--radius-sm);
  padding:var(--space-2) var(--space-3);font-size:var(--fs-md);margin-bottom:var(--space-4)}
.dot.c-ok{background:var(--ok)}
.dot.c-bad{background:var(--danger)}
.dot.c-warn{background:var(--accent)}
.dot.c-run{background:var(--dot-run)}
.delta-down{color:var(--danger);font-weight:600}
.delta-flat{color:var(--muted)}
.evt.k-budget{border-left-color:var(--danger)}
.evt.k-done{border-left-color:var(--ok)}
.evt.k-opt{border-left-color:var(--accent)}

/* ============ 暗色主题（唯一机制：令牌覆写，无切换器，设计规范 §5.4） ============ */
@media (prefers-color-scheme:dark){
:root{
  --bg:#0E1526; --card:#131C30; --fg:#C7D6F5; --fg-strong:#E6EDF3;
  --muted:#8FA3C4; --muted-bg:#1E2A44; --border:#253352; --border-strong:#33456B;
  --primary:#6B8AF5; --primary-hover:#8FA6F8; --primary-disabled:#3A4A6E; --secondary:#5B8DEF;
  --accent:#F5B14C; --accent-ink:#E8C88A; --danger:#F87171; --ok:#4ADE80; --warn-bg:#2A2114;
  --ok-ink:#7DD3A0; --ok-bg:#14261C; --ok-line:#2F5D3E;
  --bad-ink:#F2A0A0; --bad-bg:#2A1418; --bad-line:#5C2A32;
  --warn-ink:#F0B45C; --warn-line:#6B4E1F;
  --dim-ink:#93A2BC; --dim-bg:#1A2338; --dim-line:#33456B;
  --chrome-bg:#0B1222; --chrome-ink:#E6EDF3; --chrome-muted:#8FA3C4;
  --brand-arc:#F59E0B; --brand-dot:#5B8DEF; --tab-active:#F5B14C;
  --proto-bg:#3A2A0C; --proto-ink:#F0D9A0; --proto-line:#6B4E1F;
  --dot-run:#34D399; --th-bg:#1A2440; --row-hover:#182238; --surface-2:#10192C;
  --btn-hover:#1B2740; --pick-active-bg:#17233C; --gridline:#2A3A5C; --pre-ink:#D6E2F5;
  --diff-add-bg:#17301F; --diff-del-bg:#3A1A20;
  --verdict-pass-ink:#A8CDB4; --verdict-regress-ink:#F0B8B8;
  --side-ink:#C9D6EC; --side-group:#5F7699;
  --side-hover:rgba(107,138,245,.16); --side-line:rgba(143,163,196,.22); --side-line-strong:rgba(143,163,196,.32);
  --codeblock-bg:#0B1222;
}
}
</style>
{{end}}
