# v2 数据集：内联 4 条中文资讯摘要样本（train 2 / dev 1 / test 1）
# expected 为参考摘要字符串，与 f1 的字符串比较契约一致（中文按字符粒度做多重集 F1）
name: cn_news_summary

samples:
  - id: train-001
    input: |
      记者从省交通运输厅获悉，历时三年建设的跨江大桥于 9 月 28 日上午正式通车。
      大桥全长约 4.2 公里，双向六车道，设计时速 100 公里，通车后两岸车程由原来的
      40 分钟缩短至 5 分钟。工程累计投入约 58 亿元，建设期间克服了深水基础施工
      与汛期停工等困难。
    expected: 历时三年、投资约 58 亿元的跨江大桥 9 月 28 日通车，两岸车程缩短至 5 分钟。
    split: train

  - id: train-002
    input: |
      某研究团队本周在《自然》杂志发表论文称，其研制的新型固态电池在实验室条件下
      将充电时间压缩到 10 分钟以内，能量密度较主流锂电池提升约四成，且在针刺实验中
      未起火。团队负责人表示，该电池距商业化仍有五年左右，量产工艺与成本是主要障碍。
    expected: 新型固态电池充电缩至 10 分钟内、能量密度提升约四成，但商业化还需约五年。
    split: train

  - id: dev-001
    input: |
      市气象台今天下午发布寒潮蓝色预警：预计未来 48 小时全市大部分地区最低气温
      将下降 8℃ 以上，并伴有 5 到 6 级偏北大风。气象部门提醒农户提前做好大棚加固，
      市民注意添衣保暖，户外高空作业需防范大风影响。
    expected: 市气象台发布寒潮蓝色预警，未来 48 小时降温超 8℃ 并伴偏北大风。
    split: dev

  - id: test-001
    input: |
      记者从赛事组委会获悉，因台风路径与赛程冲突，原定本周日举行的城市马拉松延期至
      下月同日举办，已报名选手可保留参赛资格或于月底前申请全额退款。组委会表示，
      延期后的赛道与项目设置不变，补给点将增加两处避雨帐篷。
    expected: 受台风影响城市马拉松延期至下月同日，选手可保留资格或申请退款。
    split: test
