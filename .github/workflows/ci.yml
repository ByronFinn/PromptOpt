name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Go Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Vet
        run: go vet ./...

      # go run 形式无 $GOPATH/bin PATH 假设；版本钉死保证告警集稳定。
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...

      - name: Modernize (go-modern-guidelines)
        run: |
          output=$(go run golang.org/x/tools/gopls/internal/analysis/modernize/cmd/modernize@latest -test ./... 2>&1 | grep -v '^go: downloading' || true)
          echo "$output"
          if [ -n "$output" ]; then
            echo "::error::modernize found non-modern idioms (see log above)"
            exit 1
          fi

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...
