# Release 流水线：推送 v* tag 触发 goreleaser，出多平台单二进制产物。
# 产物矩阵与钉版原因见 .goreleaser.yaml 与 docs/release.md。
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # goreleaser 需要写权限创建 GitHub Release

jobs:
  release:
    name: Goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser 需要完整历史与 tag

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          # 钉 v2.13.0：goreleaser @latest 要求 go >= 1.27.1，与 go.mod 的
          # Go 1.26 / CI 工具链不兼容（实测）；go.mod 升 1.27+ 后可重评解钉。
          version: v2.13.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
